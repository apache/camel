# Third-party libraries by package (CAMEL-24809). The resolver matches the class name and then each enclosing
# package, so one line per library covers every class in it: org.postgresql covers the Driver, PGSimpleDataSource,
# the pooling datasources and the rest of the jar. Map at the library's own package, never a shared parent such
# as org.apache.commons, or the walk up the package would pick the wrong jar. Versions are the properties of
# camel-dependencies (KnownDependenciesVersionResolver); a literal version is used where no property exists.

# JDBC drivers, datasources and connection pools
org.postgresql = org.postgresql:postgresql:${pgjdbc-driver-version}
com.mysql.cj = com.mysql:mysql-connector-j:${debezium-mysql-connector-version}
org.mariadb.jdbc = org.mariadb.jdbc:mariadb-java-client:${mariadb-version}
com.microsoft.sqlserver.jdbc = com.microsoft.sqlserver:mssql-jdbc:12.10.0.jre11
oracle.jdbc = com.oracle.database.jdbc:ojdbc17:23.8.0.25.04
org.h2 = com.h2database:h2:${h2-version}
com.zaxxer.hikari = com.zaxxer:HikariCP:6.3.0
com.mchange.v2.c3p0 = com.mchange:c3p0:${c3p0-version}
org.apache.commons.dbcp2 = org.apache.commons:commons-dbcp2:${commons-dbcp2-version}

# Messaging clients (the Artemis package is deeper than the classic ActiveMQ one and is matched first)

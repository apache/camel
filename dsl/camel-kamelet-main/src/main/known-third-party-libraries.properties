# Third-party libraries camel run downloads on demand when a bean, a property or a Java import names one of
# their classes (CAMEL-24809). The input of camel-package-maven-plugin:prepare-kamelet-main, which generates
# camel-thirdparty-known-dependencies.properties into target/classes with the versions resolved; that file is
# shipped in the jar and never committed, this one is the source.
#
# One line per library: <package> = <groupId>:<artifactId>:<version>
#   <version> is ${a-version-property} of parent/pom.xml (checked at build time; a literal version is refused),
#   or @bom(<groupId>:<artifactId>:${bom-version-property}) for a library whose version a BOM manages.
# The runtime matches the class name and then each enclosing package, so map the library's own package and
# never a shared parent such as org.apache.commons or com.google.cloud, or the walk up the package picks the
# wrong jar. With -Dcamel.known-dependencies.verify=true the build resolves every jar and checks the package.


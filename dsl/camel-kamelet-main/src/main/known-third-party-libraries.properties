# Messaging clients. Artemis publishes under org.apache.artemis since 2.50 (the org.apache.activemq coordinates are
# relocation poms). The Artemis package is deeper than the classic ActiveMQ one and is matched first. The classic
# ActiveMQ 5 and 6 clients share the org.apache.activemq package and only one can be mapped: it is the ActiveMQ 6
# client, the Jakarta one Camel 4 needs, which speaks OpenWire to 5.x brokers too. A project that must use the 5.x
# Jakarta client declares org.apache.activemq:activemq-client-jakarta itself; a declared dependency puts the class
# on the classpath and no download is attempted.
org.apache.activemq.artemis = org.apache.artemis:artemis-jakarta-client-all:${activemq-artemis-version}
org.apache.activemq = org.apache.activemq:activemq-client:${activemq6-version}
org.apache.qpid.jms = org.apache.qpid:qpid-jms-client:${qpid-jms-client-version}
org.messaginghub.pooled.jms = org.messaginghub:pooled-jms:${pooled-jms-version}
com.ibm.mq = com.ibm.mq:com.ibm.mq.jakarta.client:${com-ibm-mq-jakarta-client-version}
org.springframework.amqp = org.springframework.amqp:spring-rabbit:${spring-rabbitmq-version}
org.apache.kafka.clients = org.apache.kafka:kafka-clients:${kafka-version}
org.apache.kafka.common = org.apache.kafka:kafka-clients:${kafka-version}
org.apache.pulsar.client = org.apache.pulsar:pulsar-client:${pulsar-version}
org.apache.rocketmq = org.apache.rocketmq:rocketmq-client:${rocketmq-version}
io.nats.client = io.nats:jnats:${jnats-version}
org.eclipse.paho.client.mqttv3 = org.eclipse.paho:org.eclipse.paho.client.mqttv3:${paho-version}

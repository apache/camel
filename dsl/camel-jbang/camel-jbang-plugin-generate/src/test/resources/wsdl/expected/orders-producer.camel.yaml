# A cxf: producer in PAYLOAD mode for the service OrderService, port OrderPort (SOAP 1.1)
# Scaffolded by: camel generate wsdl --route=producer
#
# Send the request element (XML) to direct:<operation>, such as direct:getOrder.
- route:
    id: getOrder
    description: 'Calls getOrder of OrderService: the body is the getOrder request element, and the reply the getOrderResponse response element'
    from:
      uri: direct:getOrder
      steps:
        - removeHeaders:
            note: the caller must not choose the operation or the address of the call
            pattern: Camel.*|operationName|operationNamespace|RequestContext|ResponseContext
        - to:
            uri: cxf://http://localhost:18081/orders
            parameters:
              wsdlURL: file:src/test/resources/wsdl/orders.wsdl
              serviceName: '{http://example.com/orders}OrderService'
              portName: '{http://example.com/orders}OrderPort'
              dataFormat: PAYLOAD
              defaultOperationName: getOrder
              defaultOperationNamespace: http://example.com/orders
        - convertBodyTo:
            type: java.lang.String
- route:
    id: placeOrder
    description: 'Calls placeOrder of OrderService: the body is the placeOrder request element, and the reply the placeOrderResponse response element'
    from:
      uri: direct:placeOrder
      steps:
        - removeHeaders:
            note: the caller must not choose the operation or the address of the call
            pattern: Camel.*|operationName|operationNamespace|RequestContext|ResponseContext
        - to:
            uri: cxf://http://localhost:18081/orders
            parameters:
              wsdlURL: file:src/test/resources/wsdl/orders.wsdl
              serviceName: '{http://example.com/orders}OrderService'
              portName: '{http://example.com/orders}OrderPort'
              dataFormat: PAYLOAD
              defaultOperationName: placeOrder
              defaultOperationNamespace: http://example.com/orders
        - convertBodyTo:
            type: java.lang.String

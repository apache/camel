# A cxf: consumer in PAYLOAD mode for the service OrderService, port OrderPort (SOAP 1.1)
# Scaffolded by: camel generate wsdl --route=consumer
#
# Each operation returns a placeholder response: replace it with the response element.
# The request and the response are validated against the schema of the WSDL (schemaValidationEnabled):
# until it is filled in, the placeholder gives a SOAP fault that names the first element it misses.
# The address is the path /orders of the WSDL address: the HTTP server of the runtime serves it under /services,
# such as http://localhost:8080/services/orders with the default port.
- route:
    id: OrderService
    description: The OrderService SOAP service, port OrderPort
    from:
      uri: cxf:/orders
      parameters:
        wsdlURL: file:src/test/resources/wsdl/orders.wsdl
        serviceName: '{http://example.com/orders}OrderService'
        portName: '{http://example.com/orders}OrderPort'
        dataFormat: PAYLOAD
        schemaValidationEnabled: true
      steps:
        - convertBodyTo:
            type: java.lang.String
        - choice:
            when:
              - expression:
                  simple:
                    expression: ${header.CamelCxfOperationName} == 'getOrder'
                steps:
                  - log:
                      message: 'getOrder request: ${body}'
                  - setBody:
                      note: 'TODO: build the getOrderResponse response'
                      expression:
                        constant:
                          expression: <getOrderResponse xmlns="http://example.com/orders"><!-- TODO --></getOrderResponse>
              - expression:
                  simple:
                    expression: ${header.CamelCxfOperationName} == 'placeOrder'
                steps:
                  - log:
                      message: 'placeOrder request: ${body}'
                  - setBody:
                      note: 'TODO: build the placeOrderResponse response'
                      expression:
                        constant:
                          expression: <placeOrderResponse xmlns="http://example.com/orders"><!-- TODO --></placeOrderResponse>

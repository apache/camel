# Camel MCP Server Configuration
# This file configures the Quarkus MCP Server for Apache Camel

# Server name and version for MCP protocol
quarkus.application.name=camel-mcp-server
quarkus.application.version=${camel.version:4.24.0-SNAPSHOT}

# Disable banner for cleaner stdio output
quarkus.banner.enabled=false

# Logging configuration - stderr only to avoid interfering with stdio transport
quarkus.log.console.stderr=true
quarkus.log.level=WARN
quarkus.log.category."org.apache.camel".level=INFO
quarkus.log.category."io.quarkiverse.mcp".level=INFO

# Disable HTTP server - use STDIO transport only for CLI integration
quarkus.http.host-enabled=false

# The file tools ask the client for its roots when a call names no directory: a client that does not answer
# quickly gets an answer without a default directory, not a call that hangs.
quarkus.mcp.server.roots.default-timeout=2s

# Strip null fields from JSON responses to reduce LLM token consumption.
# Applies to @Tool result records serialized via JsonTextContentEncoder.
quarkus.jackson.serialization-inclusion=non-null

## MCP Security Configuration (opt-in, disabled by default)
## Enable the security execution layer for tool-level authorization,
## audit logging, input sanitization, and secret redaction.
# camel.mcp.security.enabled=true
# camel.mcp.security.access-level=admin
# camel.mcp.security.audit.enabled=true
# camel.mcp.security.audit.include-arguments=true
## With redaction on, camel_write_file and camel_edit_file refuse content that carries the ***REDACTED*** mask.
# camel.mcp.security.redaction.enabled=true
# camel.mcp.security.redaction.patterns=
## A tool call with a string argument longer than this is rejected (never cut).
# camel.mcp.security.max-argument-length=10000

## Audit log routing (optional — route to a separate file or syslog)
# quarkus.log.category."org.apache.camel.mcp.security.audit".level=INFO

## Remote Camel CLI connector (CAMEL-26686)
## The endpoint shares the Quarkus HTTP listener and is available when HTTP is enabled
## (for example, with `camel mcp --http`). It is disabled by default to preserve the
## existing STDIO and MCP HTTP behavior. Every integration must authenticate before
## the WebSocket upgrade with Authorization: Bearer <token>. This phase supports one
## shared token/trust domain; use separate MCP server deployments for separate tenants.
# camel.mcp.remote.enabled=false
# camel.mcp.remote.token=${CAMEL_MCP_REMOTE_TOKEN}
# camel.mcp.remote.max-connections=16
# camel.mcp.remote.max-retained-runtimes=32
# camel.mcp.remote.retention-ms=3600000
# camel.mcp.remote.heartbeat-timeout-ms=90000
# camel.mcp.remote.max-frame-chars=16777216
# camel.mcp.remote.max-snapshot-chars=1048576
# camel.mcp.remote.max-retained-messages=500
# The existing connector can send messages up to 16 MiB; align the server limit.
quarkus.websockets-next.server.max-message-size=16777216

- route:
    id: welcome
    from:
      uri: timer:welcome
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            expression:
              constant:
                expression: "Welcome! Open the TUI (camel tui) and press F2 → Send Message to say hello."
        - log:
            message: "${body}"

- route:
    id: greet
    from:
      uri: direct:greet
      steps:
        - log:
            message: "Received: ${body}"
        - setBody:
            expression:
              simple:
                expression: "Hello ${body}!"

name: groovy-test
description: The groovy example logs what its README promises
actions:
  - camel:
      jbang:
        run:
          integration:
            name: "groovy"
            file: "../groovy.camel.yaml"
            systemProperties:
              file: "../application.properties"
          resources:
            - "order.json"
            - "order-bad-email.json"
  - camel:
      jbang:
        verify:
          integration: "groovy"
          logMessage: "Order ORD-1001 accepted"
  - camel:
      jbang:
        verify:
          integration: "groovy"
          logMessage: "Order ORD-1002 rejected"

name: csv-to-json-test
description: The csv-to-json example logs what its README promises
actions:
  - camel:
      cli:
        run:
          integration:
            name: "csv-to-json"
            file: "../csv-to-json.camel.yaml"
            systemProperties:
              file: "../application.properties"

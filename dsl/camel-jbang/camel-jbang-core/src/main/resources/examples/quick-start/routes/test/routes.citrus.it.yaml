name: routes-test
description: The route logs the greeting the Greeter bean built
actions:
  - camel:
      cli:
        run:
          integration:
            name: "routes"
            file: "../routes.camel.yaml"
            systemProperties:
              file: "../application.properties"
          resources:
            - "beans.yaml"
            - "Greeter.java"
  - camel:
      cli:
        verify:
          integration: "routes"
          logMessage: "Hello, Camel!"

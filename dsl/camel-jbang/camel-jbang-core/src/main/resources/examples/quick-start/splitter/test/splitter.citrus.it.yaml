name: splitter-test
description: The splitter logs the batch and then one line per item
actions:
  - camel:
      cli:
        run:
          integration:
            name: "splitter"
            file: "../splitter.camel.yaml"
  - camel:
      cli:
        verify:
          integration: "splitter"
          logMessage: "Received batch: Laptop,Phone,Tablet,Monitor,Keyboard"
  - camel:
      cli:
        verify:
          integration: "splitter"
          logMessage: "Processing item 4: Keyboard"

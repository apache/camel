# a new order every second
order.period=1000
# the port of the payment service, which the shop calls on localhost
camel.server.port=8080

# the folder the parked route writes holds data, not sources: with camel run --source-dir in dev mode,
# a change in it does not reload the routes
camel.jbang.dataDir=parked

# route refunds reads Kafka: stub it, so the example needs no broker; a refund is sent with camel cmd send
camel.jbang.stub=kafka

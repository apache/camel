name: error-handling-test
description: The error-handling example logs what its README promises
actions:
  - camel:
      jbang:
        run:
          integration:
            name: "error-handling"
            file: "../error-handling.camel.yaml"
            systemProperties:
              file: "../application.properties"
          resources:
            - "parked.camel.yaml"
            - "orders/order-1001.json"
            - "orders/order-1002.json"
            - "orders/order-1003.json"
  - camel:
      jbang:
        verify:
          integration: "error-handling"
          logMessage: "Payment for ORD-1001 charged"
  - camel:
      jbang:
        verify:
          integration: "error-handling"
          logMessage: "Payment for ORD-1002 charged"
  - camel:
      jbang:
        verify:
          integration: "error-handling"
          logMessage: "Payment for ORD-1003 declined: card declined"
  - camel:
      jbang:
        verify:
          integration: "error-handling"
          logMessage: "Order ORD-1003 parked for manual review"

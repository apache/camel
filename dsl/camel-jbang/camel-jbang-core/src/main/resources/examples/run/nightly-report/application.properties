# When the report runs, as a cron expression (seconds minutes hours day month weekday).
# Every ten seconds for the demo; a nightly run at 02:00 is: report.schedule=0 0 2 * * ?
report.schedule=0/10 * * * * ?

# The stock the report counts
inventory.tshirt=120
inventory.mug=45

# An order is one message with several lines; the warehouse picks one line at a time. The splitter
# turns the order into one message per line, and the split messages keep the order id in a variable.
- route:
    id: order-lines
    from:
      uri: file
      parameters:
        directoryName: orders
        noop: true
        sortBy: "file:name"
      steps:
        - unmarshal:
            json:
              library: Jackson
        - setVariable:
            name: orderId
            expression:
              simple:
                expression: "${body[orderId]}"
        - log:
            message: "Order ${variable.orderId} with ${body[lines].size()} line(s)"
        - split:
            expression:
              simple:
                expression: "${body[lines]}"
            steps:
              - log:
                  message: "  pick ${body[qty]} x ${body[sku]} for ${variable.orderId}"
        - log:
            message: "Order ${variable.orderId}: all ${body[lines].size()} line(s) sent to picking"

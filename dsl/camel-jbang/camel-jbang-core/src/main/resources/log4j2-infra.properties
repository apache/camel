# camel infra run: the progress of pulling the container image, as plain lines, and errors
status = warn
name = CamelInfraLog4jConfiguration

appender.out.type = Console
appender.out.name = out
appender.out.layout.type = PatternLayout
appender.out.layout.pattern = %m%n

appender.pull.type = Console
appender.pull.name = pull
appender.pull.layout.type = PatternLayout
appender.pull.layout.pattern = %m%n
# only the pull messages of Testcontainers, not the creating and starting of the container
# (not "Starting to pull image" either: it repeats the "Pulling docker image" line just before it)
appender.pull.filter.pull.type = RegexFilter
appender.pull.filter.pull.regex = (Pulling docker image|Pulling image layers|Pull complete|Retrying pull|Failed to pull|Docker image pull).*
appender.pull.filter.pull.onMatch = ACCEPT
appender.pull.filter.pull.onMismatch = DENY

rootLogger.level = error
rootLogger.appenderRef.out.ref = out

# Testcontainers logs the pull of an image on the logger tc.<image>
logger.tc.name = tc
logger.tc.level = info
logger.tc.additivity = false
logger.tc.appenderRef.pull.ref = pull

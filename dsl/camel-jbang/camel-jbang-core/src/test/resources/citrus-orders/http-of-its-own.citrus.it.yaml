name: orders.citrus.it
author: Citrus
status: FINAL
description: Test the order API by posting a sample order and verifying the log output

variables:
  - name: orderId
    value: ORD-1001
  - name: customer
    value: C-482

actions:
  # Read the sample order from file
  - http:
      uri: http://localhost:8080/orders
      method: POST
      requestFile: sample-order.json
      contentType: application/json
      expectStatus: 201

  # Verify the log message contains the expected text
  - log:
      message: "Verifying order was accepted"
      logLevel: INFO

  # Check that the integration logged the expected message
  - assert-log:
      pattern: "Order ORD-1001 accepted for C-482 with 2 line\\(s\\)"
      count: 1
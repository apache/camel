name: orders.citrus.it
author: Citrus
status: FINAL
description: Test for the order API
variables:
  - name: orderId
    value: ORD-1001
  - name: customerId
    value: C-482
actions:
  # Send POST request to /orders with the sample order
  - http:
      request:
        uri: http://localhost:8080/orders
        method: POST
        body: |
          {
            "orderId": "ORD-1001",
            "customer": "C-482",
            "country": "DK",
            "lines": [
              {"sku": "CAMEL-TSHIRT", "qty": 2, "price": 19.95},
              {"sku": "CAMEL-MUG", "qty": 1, "price": 9.50}
            ]
          }
        contentType: application/json
      response:
        statusCode: 201
        body: |
          {
            "orderId": "ORD-1001",
            "status": "accepted"
          }

  # Verify the log message contains the expected text
  - log:
      message: "Order ${orderId} accepted for ${customerId} with 2 line(s)"
      level: INFO

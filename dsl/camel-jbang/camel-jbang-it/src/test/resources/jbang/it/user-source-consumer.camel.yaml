# A simple route that consumes from the local user-source kamelet.
# Used by LocalKameletsITCase to verify that --local-kamelet-dir is honoured.
- from:
    uri: "kamelet:user-source"
    parameters:
      period: "2000"
    steps:
      - log: "${body}"

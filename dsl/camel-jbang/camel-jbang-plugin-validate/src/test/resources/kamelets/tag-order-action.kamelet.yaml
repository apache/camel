apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: tag-order-action
  labels:
    camel.apache.org/kamelet.type: action
spec:
  definition:
    title: Tag Order
    # the tag is what the agent passes
    required:
      - tag
    type: object
    properties:
      tag:
        title: Tag
        type: string
      priority:
        title: Priority
        type: boolean
        default: false
  template:
    beans:
      - name: tagger
        type: "#class:java.util.HashMap"
        properties:
          zeta: "{{tag}}"
          alpha: "{{priority}}"
    from:
      uri: kamelet:source
      steps:
        - choice:
            when:
              - simple: "${header.priority} == true"
                steps:
                  - setBody:
                      simple: "${body} [!{{tag}}]"
            otherwise:
              steps:
                - setBody:
                    simple: "${body} [{{tag}}]"
        - to: kamelet:sink
  dependencies:
    - "camel:core"
    - "camel:kamelet"

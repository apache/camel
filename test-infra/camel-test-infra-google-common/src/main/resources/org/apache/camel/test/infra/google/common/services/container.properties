# Floci GCP: the local Google Cloud services
google.container=mirror.gcr.io/floci/floci-gcp:0.12.0
google.container.version.exclude=latest,nightly,compat
# floci-duck: the SQL engine that Floci GCP starts, through the Docker socket, for the queries of BigQuery. Floci GCP
# takes its latest image by default: the version is pinned to one that works with the Floci GCP image of
# google.container, and changes with it.
google.bigquery.engine.container=mirror.gcr.io/floci/floci-duck:0.4.1
google.bigquery.engine.container.version.include=0.4.1

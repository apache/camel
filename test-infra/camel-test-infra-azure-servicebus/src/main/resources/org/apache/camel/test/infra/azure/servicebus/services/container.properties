# The Artemis broker that Floci AZ (azure.container) starts for the Service Bus data plane. Floci AZ copies AMQP jars
# patched for one Artemis version into it, so the version must be the one that the Floci AZ image expects (its
# FLOCI_AZ_SERVICES_SERVICE_BUS_ARTEMIS_IMAGE default): it is pinned, and changes with azure.container. The key does
# not end with "artemis": the test-infra metadata would take this version for the Artemis services.
azure.servicebus.broker.container=mirror.gcr.io/apache/activemq-artemis:2.44.0
azure.servicebus.broker.container.version.include=2.44.0

# Floci AZ: the local Azure services
azure.container=mirror.gcr.io/floci/floci-az:0.16.0
azure.container.version.exclude=latest,nightly,compat
# Artemis: the AMQP broker that Floci AZ starts for Event Hubs and Service Bus. Floci AZ copies AMQP jars patched for one
# Artemis version into it, so the version must be the one that the Floci AZ image of azure.container expects: it is
# pinned, and changes with azure.container. The key does not end with "artemis": the test-infra metadata would take
# this version for the Artemis services.
azure.broker.container=mirror.gcr.io/apache/activemq-artemis:2.44.0
azure.broker.container.version.include=2.44.0
# Azurite: the local Blob and Queue services, until Floci AZ covers what their tests use
azure.storage.blob.container=mcr.microsoft.com/azure-storage/azurite:3.37.0
azure.storage.blob.container.version.exclude=table-alpha,amd64,arm64,preview,latest
azure.storage.queue.container=mcr.microsoft.com/azure-storage/azurite:3.37.0
azure.storage.queue.container.version.exclude=table-alpha,amd64,arm64,preview,latest

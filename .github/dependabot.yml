version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Quarkus related
      - dependency-name: "io.vertx:*"
      - dependency-name: "io.smallrye:jandex:*"
      # Spring Boot Dependencies related
      - dependency-name: "org.apache.logging.log4j:*"
      # This is a virtual plugin which doesn't really exist
      - dependency-name: "org.eclipse.m2e:lifecycle-mapping"
      # Managed manually - gencode version must be <= the lowest runtime version across Spring Boot and Quarkus
      - dependency-name: "com.google.protobuf:*"
      # fugue 7 is compiled for Java 25 and breaks camel-jira on Java 17 and 21 (CAMEL-25401): revisit when Camel's minimum Java is 25
      - dependency-name: "io.atlassian.fugue:fugue"
        update-types: ["version-update:semver-major"]
      # classgraph 6 is compiled for Java 25 and drops an API camel-datasonnet uses: revisit when Camel's minimum Java is 25
      - dependency-name: "io.github.classgraph:classgraph"
        update-types: ["version-update:semver-major"]
      # Jackson 3 uses the 2.x jackson-annotations
      - dependency-name: "com.fasterxml.jackson.core:jackson-annotations"
        update-types: ["version-update:semver-major"]
      # Jackson 3.3 Blackbird needs Java 25, and jtoon 3.0.0 (camel-toon) registers it, so camel-toon fails on Java 21:
      # revisit when jtoon no longer registers Blackbird below Java 25, or when Camel's minimum Java is 25
      - dependency-name: "tools.jackson:*"
        versions: [">= 3.3.0"]
      - dependency-name: "tools.jackson.*:*"
        versions: [">= 3.3.0"]
      # sdk-core 9.25.0 and later need OkHttp 5, and the IBM SDKs of camel-ibm are built with OkHttp 4: revisit when they move to OkHttp 5
      - dependency-name: "com.ibm.cloud:sdk-core"
        versions: [">= 9.25.0"]
      # smack 4.4.x asks for jxmpp in the range [1.0.0,1.0.999]: revisit when camel-xmpp moves to a smack that accepts 1.1
      - dependency-name: "org.jxmpp:*"
        versions: [">= 1.1.0"]
    groups:
      Aliyun:
        patterns: ["com.aliyun:*","com.aliyun.openservices:*","com.aliyun.mns:*"]
      Micrometer:
        patterns: ["io.micrometer:*"]
      Opentelemetry:
        patterns: ["io.opentelemetry:*"]
      LangChain4j:
        patterns: ["dev.langchain4j:*"]
      Parquet:
        patterns: ["org.apache.parquet:*"]
      CometD:
        patterns: ["org.cometd.java:*"]
      Elasticsearch:
        patterns: ["org.elasticsearch.client:*", "co.elastic.clients:*"]
      Google-cloud:
        patterns: ["com.google.cloud:*"]
      Avro:
        patterns: ["org.apache.avro:*"]
      Kamelet:
        patterns: ["org.apache.camel.kamelets:*"]
      Jackson:
        patterns: ["com.fasterxml.jackson:*", "com.fasterxml.jackson.*:*", "tools.jackson:*", "tools.jackson.*:*"]
    open-pull-requests-limit: 20
  - package-ecosystem: "npm"
    directory: "docs"
    schedule:
       interval: "weekly"

name: Generate SBOM

# This workflow lives on the default branch (main) only. GitHub fires the
# `schedule` trigger from the default branch alone, so a single copy here can
# regenerate the SBOM for main and for every active LTS maintenance branch by
# checking each one out in turn (matrix.branch) and opening a PR back against it.
# When an LTS line goes EOL, remove it from the matrix below.
on:
  schedule:
    # Every Sunday at 14:30 UTC
  - cron: '30 14 * * 0'
  workflow_dispatch:

permissions: {}
jobs:
  build:
    if: github.repository == 'apache/camel'
    permissions:
      contents: write
      pull-requests: write # to create a PR (peter-evans/create-pull-request)

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [ 'main', 'camel-4.22.x', 'camel-4.18.x' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - id: install-mvnd
        uses: ./.github/actions/install-mvnd
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: mvn build and sbom generation
        run: ./mvnw -B -l build.log -Psbom -Dquickly verify
      - name: archive logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-${{ matrix.branch }}.log
          path: build.log
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ matrix.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Regen SBOM for ${{ matrix.branch }}"
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: true
          branch: regen_bot_sbom_${{ matrix.branch }}
          title: "Generated sources regen for SBOM (${{ matrix.branch }})"
          body: |
            Regen bot :robot: found some uncommitted changes after running build on :camel: `${{ matrix.branch }}` branch for generating SBOMs.
            Please do not delete `regen_bot_sbom_${{ matrix.branch }}` branch after merge/rebase.
          labels: |
            regen
            automated pr
            camel-4
          assignees: oscerd

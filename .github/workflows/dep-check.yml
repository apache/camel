name: 'Dependency Analysis'

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - .claude-plugin/**
      - .idea/**
      - .github/**
      - .oss-ai-helper-rules/**
      - AGENTS.md
      - README.md
      - SECURITY.md
      - Jenkinsfile
      - Jenkinsfile.*
      - NOTICE.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dep-check:
    if: github.repository == 'apache/camel'
    name: Dependency Analysis (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run dependency analysis
        run: |
          mvn verify -Pdep-check -DskipTests -Dlicense.skip -Dquickly \
            --no-transfer-progress --batch-mode -q \
            2>&1 | tee dep-check-output.txt || true

      - name: Upload dependency analysis report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dep-check-report
          path: dep-check-output.txt
          retention-days: 7

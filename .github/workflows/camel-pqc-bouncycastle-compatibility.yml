name: camel-pqc Bouncy Castle compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - 'components/camel-pqc/**'
      - 'components/pom.xml'
      - 'components/camel-pqc-micrometer/**'
      - 'components/camel-pqc-bc-compat-187/**'
      - 'components/camel-pqc-bc-compat-186/**'
      - 'components/camel-pqc-bc-compat-api/**'
      - 'parent/pom.xml'
      - 'etc/scripts/camel-pqc-bouncycastle-compatibility.py'
      - 'etc/scripts/check-camel-pqc-bouncycastle-imports.py'
      - '.github/workflows/camel-pqc-bouncycastle-compatibility.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.event_name != 'schedule' || github.repository == 'apache/camel'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Enforce camel-pqc Bouncy Castle production import boundary
        run: python3 etc/scripts/check-camel-pqc-bouncycastle-imports.py
      - name: Run camel-pqc Bouncy Castle compatibility matrix
        run: python3 etc/scripts/camel-pqc-bouncycastle-compatibility.py ${{ github.event_name == 'pull_request' && '--skip-latest' || '' }}

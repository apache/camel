<text x="846" y="555" font-size="12" fill="#151515">as JSON text</text>
<text x="28" y="616" font-size="12" fill="#6a6e73">The labels on the arrows are the body each step leaves. Left: today, each component and step gives its own Java type, and the steps that expect JSON fail.</text>
<text x="28" y="634" font-size="12" fill="#6a6e73">Right: payloadMode json keeps JSON data inside the route; producers, headers and logs get the JSON text. A sketch of the proposal.</text>

# WS-Security UsernameToken with endpoint options only, no Java code
- beans:
    - name: users
      type: java.util.HashMap
      properties:
        dave: lister
        kryten: "4000"
- route:
    id: yaml-server
    from:
      uri: "cxf://http://localhost:{{wssec.port}}/CxfWsSecurityYamlTest/orders"
      parameters:
        wsdlURL: classpath:wssec/orders.wsdl
        dataFormat: PAYLOAD
        wsSecurityCredentials: "#bean:users"
        wsSecurityPasswordType: Digest
      steps:
        - setBody:
            constant: '<getOrderResponse xmlns="http://camel.apache.org/wssec/orders"><orderId>1</orderId><user>ok</user></getOrderResponse>'
- route:
    id: yaml-client
    from:
      uri: direct:yaml
      steps:
        - to:
            uri: "cxf://http://localhost:{{wssec.port}}/CxfWsSecurityYamlTest/orders"
            parameters:
              wsdlURL: classpath:wssec/orders.wsdl
              dataFormat: PAYLOAD
              defaultOperationName: getOrder
              wsSecurityUsername: dave
              wsSecurityPassword: lister
              wsSecurityPasswordType: Digest
- route:
    id: yaml-client-bad
    from:
      uri: direct:yamlBad
      steps:
        - to:
            uri: "cxf://http://localhost:{{wssec.port}}/CxfWsSecurityYamlTest/orders"
            parameters:
              wsdlURL: classpath:wssec/orders.wsdl
              dataFormat: PAYLOAD
              defaultOperationName: getOrder
              wsSecurityUsername: dave
              wsSecurityPassword: wrong
              wsSecurityPasswordType: Digest

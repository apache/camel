appender.out.type = RollingFile
appender.out.name = out
appender.out.fileName = target/camel-kafka-share-test.log
appender.out.filePattern = target/camel-kafka-share-test.%i.log
appender.out.policies.type = Policies
appender.out.policies.size.type = SizeBasedTriggeringPolicy
appender.out.policies.size.size = 50MB
appender.out.strategy.type = DefaultRolloverStrategy
appender.out.strategy.max = 1
appender.out.layout.type = PatternLayout
appender.out.layout.pattern = %d [%-15.15t] %-5p %-30.30c{1} - %m%n
appender.stdout.type = Console
appender.stdout.name = stdout
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = %d [%-15.15t] %-5p %-30.30c{1} - %m%n

rootLogger.level = WARN
rootLogger.appenderRef.out.ref = out

logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN

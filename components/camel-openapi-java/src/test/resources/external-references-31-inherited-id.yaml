# An OpenAPI 3.1 contract whose Pet schema has an $id on a server that does not exist and references a schema on the classpath; the parser keeps the $id when it follows that reference
openapi: 3.1.0
info:
  title: Pets
  version: "1.0"
servers:
  - url: http://localhost:8080/api
paths:
  /pets/{petId}:
    get:
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      $id: https://schemas.example.invalid/schemas/
      type: object
      properties:
        owner:
          $ref: 'classpath:///external-references-31-bridge.yaml'

apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: vt-repro-source
  labels:
    camel.apache.org/kamelet.type: source
spec:
  definition:
    title: VT repro source
  template:
    from:
      uri: timer:tick
      parameters:
        period: "1000"
        repeatCount: "1"
        delay: "-1"
      steps:
        - setBody:
            constant: hello
        - to:
            uri: kamelet:sink

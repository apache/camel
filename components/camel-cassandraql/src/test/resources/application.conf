# Speed up the tests: the driver waits for a 2 seconds "quiet period" on each session close (netty graceful
# shutdown), which adds 2 seconds to the teardown of every single test.
datastax-java-driver.advanced.netty {
  io-group.shutdown {quiet-period = 0, timeout = 5, unit = SECONDS}
  admin-group.shutdown {quiet-period = 0, timeout = 5, unit = SECONDS}
}

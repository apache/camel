# A contract whose Pet schema lives in schemas/external-references-pet.yaml, which references a document next to it
openapi: 3.0.3
info:
  title: Pets
  version: "1.0"
paths:
  /pets/{petId}:
    get:
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: 'schemas/external-references-pet.yaml#/components/schemas/Pet'

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Four ways to use AI with the Camel TUI</title>
  <desc id="desc">Built-in AI panel, coding agent over ACP, external agent over the TUI MCP server, and the standalone camel mcp server. The first three reach Camel through the TUI tool registry, the fourth reaches running integrations and the catalog without the TUI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .h1 { font-size: 22px; font-weight: 700; fill: #1f2328; }
      .sub { font-size: 13px; fill: #57606a; }
      .num { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .colt { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .cols { font-size: 12px; fill: #ffffff; }
      .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; fill: #6e7781; }
      .t { font-size: 13px; fill: #1f2328; }
      .tb { font-size: 13px; font-weight: 700; fill: #1f2328; }
      .edge { font-size: 11px; fill: #444c56; font-style: italic; }
      .code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .line { stroke: #555; stroke-width: 1.6; fill: none; }
      .box { stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="800"/>

  <text class="h1" x="30" y="40">Four ways to use AI with the Camel TUI</text>
  <text class="sub" x="30" y="62">Where you type, who runs the model, and how the Camel tools are reached</text>

  <!-- ===================== Column 1: built-in AI ===================== -->
  <g>
    <rect x="30" y="85" width="280" height="62" rx="8" fill="#2f6fdf"/>
    <text class="num" x="46" y="124">1</text>
    <text class="colt" x="72" y="111">Built-in AI panel</text>
    <text class="cols" x="72" y="131">F8 with an LLM provider</text>

    <rect class="box" x="30" y="170" width="280" height="64" rx="8" fill="#eaf1fd" stroke="#2f6fdf"/>
    <text class="lbl" x="44" y="189">YOU TYPE IN</text>
    <text class="tb" x="44" y="210">The TUI AI panel (F8)</text>
    <text class="t" x="44" y="226">or Shift+F8 "fix with AI"</text>

    <rect class="box" x="30" y="282" width="280" height="80" rx="8" fill="#eaf1fd" stroke="#2f6fdf"/>
    <text class="lbl" x="44" y="301">THE MODEL</text>
    <text class="tb" x="44" y="322">LLM provider, called by the TUI</text>
    <text class="t" x="44" y="339">Anthropic, OpenAI, Gemini, or local:</text>
    <text class="t" x="44" y="355">Ollama, LM Studio, vLLM ...</text>

    <rect class="box" x="30" y="410" width="280" height="64" rx="8" fill="#eaf1fd" stroke="#2f6fdf"/>
    <text class="lbl" x="44" y="429">CAMEL TOOLS VIA</text>
    <text class="tb" x="44" y="450">In-process, no MCP</text>
    <text class="t" x="44" y="466">the panel runs the tool calls itself</text>

    <path class="line" d="M170,234 L170,280" marker-end="url(#arrow)"/>
    <text class="edge" x="178" y="262">HTTP API</text>
    <path class="line" d="M170,362 L170,408" marker-end="url(#arrow)"/>
    <text class="edge" x="178" y="390">tool calls</text>
    <path class="line" d="M170,474 L170,518" marker-end="url(#arrow)"/>
  </g>

  <!-- ===================== Column 2: ACP agent ===================== -->
  <g>
    <rect x="330" y="85" width="280" height="62" rx="8" fill="#8a4fd6"/>
    <text class="num" x="346" y="124">2</text>
    <text class="colt" x="372" y="111">Coding agent in the panel</text>
    <text class="cols" x="372" y="131">F8, Ctrl+P, pick an acp: provider</text>

    <rect class="box" x="330" y="170" width="280" height="64" rx="8" fill="#f3ecfc" stroke="#8a4fd6"/>
    <text class="lbl" x="344" y="189">YOU TYPE IN</text>
    <text class="tb" x="344" y="210">The TUI AI panel (F8)</text>
    <text class="t" x="344" y="226">the agent's answers show there</text>

    <rect class="box" x="330" y="282" width="280" height="80" rx="8" fill="#f3ecfc" stroke="#8a4fd6"/>
    <text class="lbl" x="344" y="301">THE MODEL</text>
    <text class="tb" x="344" y="322">ACP agent started by the TUI</text>
    <text class="t" x="344" y="339">Claude Code, Codex, opencode, Qwen ...</text>
    <text class="t" x="344" y="355">with its own model and login</text>

    <rect class="box" x="330" y="410" width="280" height="64" rx="8" fill="#f3ecfc" stroke="#8a4fd6"/>
    <text class="lbl" x="344" y="429">CAMEL TOOLS VIA</text>
    <text class="tb" x="344" y="450">TUI MCP server, started for it</text>
    <text class="t" x="344" y="466">random port on 127.0.0.1</text>

    <path class="line" d="M470,234 L470,280" marker-end="url(#arrow)"/>
    <text class="edge" x="478" y="262">ACP over stdio</text>
    <path class="line" d="M470,362 L470,408" marker-end="url(#arrow)"/>
    <text class="edge" x="478" y="390">MCP over HTTP</text>
    <path class="line" d="M470,474 L470,518" marker-end="url(#arrow)"/>
  </g>

  <!-- ===================== Column 3: external agent over the TUI MCP server ===================== -->
  <g>
    <rect x="630" y="85" width="280" height="62" rx="8" fill="#0f8f7a"/>
    <text class="num" x="646" y="124">3</text>
    <text class="colt" x="672" y="111">Your agent drives the TUI</text>
    <text class="cols" x="672" y="131">camel tui --mcp</text>

    <rect class="box" x="630" y="170" width="280" height="64" rx="8" fill="#e6f5f2" stroke="#0f8f7a"/>
    <text class="lbl" x="644" y="189">YOU TYPE IN</text>
    <text class="tb" x="644" y="210">Your agent, in its own window</text>
    <text class="t" x="644" y="226">the TUI is the screen you share</text>

    <rect class="box" x="630" y="282" width="280" height="80" rx="8" fill="#e6f5f2" stroke="#0f8f7a"/>
    <text class="lbl" x="644" y="301">THE MODEL</text>
    <text class="tb" x="644" y="322">Your agent's own model</text>
    <text class="t" x="644" y="339">Claude Code, Codex, Cursor, any</text>
    <text class="t" x="644" y="355">MCP client</text>

    <rect class="box" x="630" y="410" width="280" height="64" rx="8" fill="#e6f5f2" stroke="#0f8f7a"/>
    <text class="lbl" x="644" y="429">CAMEL TOOLS VIA</text>
    <text class="tb" x="644" y="450">TUI MCP server</text>
    <text class="t" x="644" y="466">localhost:8123 (--mcp-port)</text>

    <path class="line" d="M770,234 L770,280" marker-end="url(#arrow)"/>
    <text class="edge" x="778" y="262">your terminal / IDE</text>
    <path class="line" d="M770,362 L770,408" marker-end="url(#arrow)"/>
    <text class="edge" x="778" y="390">MCP over HTTP</text>
    <path class="line" d="M770,474 L770,518" marker-end="url(#arrow)"/>
  </g>

  <!-- ===================== Column 4: camel mcp, no TUI ===================== -->
  <g>
    <rect x="930" y="85" width="280" height="62" rx="8" fill="#c26a12"/>
    <text class="num" x="946" y="124">4</text>
    <text class="colt" x="972" y="111">Camel MCP server, no TUI</text>
    <text class="cols" x="972" y="131">camel mcp</text>

    <rect class="box" x="930" y="170" width="280" height="64" rx="8" fill="#fcf0e3" stroke="#c26a12"/>
    <text class="lbl" x="944" y="189">YOU TYPE IN</text>
    <text class="tb" x="944" y="210">Your agent, in its own window</text>
    <text class="t" x="944" y="226">no TUI needed</text>

    <rect class="box" x="930" y="282" width="280" height="80" rx="8" fill="#fcf0e3" stroke="#c26a12"/>
    <text class="lbl" x="944" y="301">THE MODEL</text>
    <text class="tb" x="944" y="322">Your agent's own model</text>
    <text class="t" x="944" y="339">Claude Code, Codex, Cursor, any</text>
    <text class="t" x="944" y="355">MCP client</text>

    <rect class="box" x="930" y="410" width="280" height="64" rx="8" fill="#fcf0e3" stroke="#c26a12"/>
    <text class="lbl" x="944" y="429">CAMEL TOOLS VIA</text>
    <text class="tb" x="944" y="450">camel mcp server</text>
    <text class="t" x="944" y="466">stdio (or HTTP), started by the agent</text>

    <path class="line" d="M1070,234 L1070,280" marker-end="url(#arrow)"/>
    <text class="edge" x="1078" y="262">your terminal / IDE</text>
    <path class="line" d="M1070,362 L1070,408" marker-end="url(#arrow)"/>
    <text class="edge" x="1078" y="390">MCP over stdio</text>
    <path class="line" d="M1070,474 L1070,618" marker-end="url(#arrow)"/>
    <text class="edge" x="1078" y="550">catalog + camel_* tools,</text>
    <text class="edge" x="1078" y="565">no tui_* tools</text>
  </g>

  <!-- ===================== Shared TUI band (columns 1-3) ===================== -->
  <rect class="box" x="30" y="520" width="880" height="76" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text class="tb" x="46" y="545">Camel TUI tool registry: the same tools whichever way you came in</text>
  <text class="t" x="46" y="565">tui_* tools see and drive the screen: tabs, tables, traces, errors, logs, diagrams, drawing</text>
  <text class="t" x="46" y="583">camel_* tools build and run: catalog docs, validate, read and write sources (writes wait for your OK)</text>
  <path class="line" d="M470,596 L470,618" marker-end="url(#arrow)"/>

  <!-- ===================== Bottom band (all) ===================== -->
  <rect class="box" x="30" y="620" width="1180" height="60" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <text class="tb" x="46" y="645">Your Camel integrations and project</text>
  <text class="t" x="46" y="665">running integrations (camel run, Spring Boot, Quarkus) through ~/.camel, route source files, the Camel catalog</text>

  <!-- ===================== How to start ===================== -->
  <text class="lbl" x="30" y="712">HOW TO START</text>
  <text class="code" x="30" y="734">camel tui</text>
  <text class="t" x="30" y="754">then F8 (provider from env or Ctrl+P)</text>

  <text class="code" x="330" y="734">camel tui</text>
  <text class="t" x="330" y="754">then F8, Ctrl+P, acp:claude, acp:codex ...</text>

  <text class="code" x="630" y="734">camel tui --mcp</text>
  <text class="t" x="630" y="754">and add http://localhost:8123/mcp</text>
  <text class="t" x="630" y="772">to your agent's MCP config</text>

  <text class="code" x="930" y="734">camel mcp</text>
  <text class="t" x="930" y="754">registered as an MCP server in your</text>
  <text class="t" x="930" y="772">agent's config</text>
</svg>
